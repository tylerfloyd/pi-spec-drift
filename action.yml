name: "Spec Drift Review"
description: "Review a change against its spec using Jev. Run only a trusted, pinned copy of this action."
inputs:
  api-key:
    description: "TypeSafe API key."
    required: true
  root:
    description: "Absolute path to the repository under review."
    required: false
    default: "${{ github.workspace }}"
  spec-glob:
    description: "Comma-separated spec globs."
    required: false
  block:
    description: "Whether clear drift fails the check."
    default: "false"
  model:
    description: "Optional model override."
    required: false
  base:
    description: "Base revision (required with head)."
    required: true
  head:
    description: "Head revision."
    required: true
  pr-title:
    description: "PR title, treated as data."
    required: false
  pr-desc:
    description: "PR description, treated as data."
    required: false
  repo-label:
    description: "Repository label."
    required: false
outputs:
  report-md:
    description: "Fresh report path outside the reviewed checkout. May not exist if execution failed early."
    value: ${{ steps.review.outputs.report-md }}
  report-json:
    description: "Fresh JSON report path."
    value: ${{ steps.review.outputs.report-json }}
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Build trusted bot source
      working-directory: ${{ github.action_path }}
      shell: bash
      run: npm ci --ignore-scripts && npm run build
    - name: Run review
      id: review
      shell: bash
      env:
        TYPESAFE_API_KEY: ${{ inputs.api-key }}
        BOT_PATH: ${{ github.action_path }}
        REVIEW_ROOT: ${{ inputs.root }}
        INPUT_GLOB: ${{ inputs.spec-glob }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_HEAD: ${{ inputs.head }}
        INPUT_TITLE: ${{ inputs.pr-title }}
        INPUT_DESC: ${{ inputs.pr-desc }}
        INPUT_REPO: ${{ inputs.repo-label }}
        INPUT_BLOCK: ${{ inputs.block }}
      run: |
        set -euo pipefail
        REPORT_DIR=$(mktemp -d "$RUNNER_TEMP/specdrift-XXXXXX")
        printf 'report-md=%s/report.md\nreport-json=%s/report.json\n' "$REPORT_DIR" "$REPORT_DIR" >> "$GITHUB_OUTPUT"
        ARGS=(review --root "$REVIEW_ROOT"
          --base "$INPUT_BASE" --head "$INPUT_HEAD"
          --report-md "$REPORT_DIR/report.md" --report-json "$REPORT_DIR/report.json")
        if [ -n "$INPUT_GLOB" ]; then ARGS+=(--spec-glob "$INPUT_GLOB"); fi
        if [ -n "$INPUT_MODEL" ]; then ARGS+=(--model "$INPUT_MODEL"); fi
        if [ -n "$INPUT_TITLE" ]; then ARGS+=(--pr-title "$INPUT_TITLE"); fi
        if [ -n "$INPUT_DESC" ]; then ARGS+=(--pr-desc "$INPUT_DESC"); fi
        if [ -n "$INPUT_REPO" ]; then ARGS+=(--repo "$INPUT_REPO"); fi
        case "$INPUT_BLOCK" in
          true|false) ARGS+=("--block=$INPUT_BLOCK") ;;
          *) echo 'block must be true or false' >&2; exit 2 ;;
        esac
        node "$BOT_PATH/dist/cli.js" "${ARGS[@]}"
