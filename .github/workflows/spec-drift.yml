name: Spec Drift (reusable)

on:
  workflow_call:
    inputs:
      owner:
        type: string
        required: true
      repo:
        type: string
        required: true
      pr-number:
        type: number
        required: true
      base:
        type: string
        required: true
      head:
        type: string
        required: true
      pr-title:
        type: string
        default: ""
      pr-desc:
        type: string
        default: ""
      spec-glob:
        type: string
        default: ""
      model:
        type: string
        default: ""
      block:
        description: "true/false to force blocking. Leave empty to defer to the reviewed repo's .spec-drift.json / SPEC_DRIFT_BLOCK."
        type: string
        default: ""
      bot-ref:
        description: "Explicit trusted bot ref; pin to the same commit as this workflow. Never use the PR head."
        type: string
        required: true
    secrets:
      TYPESAFE_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Validate review target
        uses: actions/github-script@v7
        env:
          OWNER: ${{ inputs.owner }}
          REPO: ${{ inputs.repo }}
          PR_NUMBER: ${{ inputs.pr-number }}
          BASE: ${{ inputs.base }}
          HEAD: ${{ inputs.head }}
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr || process.env.OWNER !== context.repo.owner || process.env.REPO !== context.repo.repo ||
                Number(process.env.PR_NUMBER) !== pr.number || process.env.BASE !== pr.base.sha || process.env.HEAD !== pr.head.sha) {
              throw new Error('Inputs must match the triggering pull request');
            }

      - name: Checkout trusted bot source
        uses: actions/checkout@v4
        with:
          repository: tylerfloyd/spec-drift
          ref: ${{ inputs.bot-ref }}
          path: _specdrift
          persist-credentials: false

      - name: Checkout pull request as data only
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.owner }}/${{ inputs.repo }}
          ref: refs/pull/${{ inputs.pr-number }}/head
          path: _review
          fetch-depth: 0
          persist-credentials: false

      - name: Verify reviewed commit
        shell: bash
        env:
          EXPECTED_HEAD: ${{ inputs.head }}
        run: |
          test "$(git -C "$GITHUB_WORKSPACE/_review" rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Run trusted review action
        id: review
        uses: ./_specdrift
        with:
          api-key: ${{ secrets.TYPESAFE_API_KEY }}
          root: ${{ github.workspace }}/_review
          spec-glob: ${{ inputs.spec-glob }}
          model: ${{ inputs.model }}
          block: ${{ inputs.block }}
          base: ${{ inputs.base }}
          head: ${{ inputs.head }}
          pr-title: ${{ inputs.pr-title }}
          pr-desc: ${{ inputs.pr-desc }}
          repo-label: ${{ inputs.owner }}/${{ inputs.repo }}

      - name: Post freshly generated report
        if: ${{ always() && steps.review.outputs.report-md != '' }}
        uses: actions/github-script@v7
        env:
          REPORT_PATH: ${{ steps.review.outputs.report-md }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const file = path.resolve(process.env.REPORT_PATH);
            const temp = fs.realpathSync(process.env.RUNNER_TEMP) + path.sep;
            if (!fs.existsSync(file)) {
              core.warning('Review failed without producing a report');
              return;
            }
            if (!fs.realpathSync(file).startsWith(temp)) throw new Error('Report must be in runner temporary storage');
            const body = fs.readFileSync(file, 'utf8');
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
